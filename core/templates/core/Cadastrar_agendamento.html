{% extends 'core/base.html' %}

{% block content %}
    <section class="page-hero">
        <div class="page-title">
            <span>Agendamento</span>
            <h1>Cadastrar novo horário</h1>
            <p>Preencha os dados do cliente, escolha o serviço e confirme o melhor horário para o atendimento.</p>
        </div>

        <form method="post" class="form-card">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="availability-message" id="availability-message" aria-live="polite">Escolha uma data para ver os horários disponíveis.</p>
            <button type="submit">Agendar agora</button>
        </form>
    </section>
{% endblock %}
