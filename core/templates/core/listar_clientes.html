{% extends 'core/base.html' %}

{% block content %}

<section>
    <h1>LISTA DE CLIENTES</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente.nome }}</td>
                    <td>{{ cliente.telefone }}</td>
                    <td>{{ cliente.email }}</td>

                    <td>
                        <a href="{% url 'editar_cliente' cliente.id %}">Editar</a>
                        <form action="{% url 'excluir_cliente' cliente.id %}" method="POST" style="display:inline; margin:0; padding:0;">
                            {% csrf_token %}
                            <button class="button-link" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">
                        Nenhum cliente cadastrado.
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</section>

{% endblock %}
